<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Thank You</title>
  <meta http-equiv="refresh" content="3; URL='contact.html?success=1'" />
  <link rel="icon" type="image/png" href="fav/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="fav/favicon.svg" />
  <link rel="shortcut icon" href="fav/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="fav/apple-touch-icon.png" />
  <link rel="manifest" href="fav/site.webmanifest" />
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding-top: 120px;
      color: #111827;
    }

    .box {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 36px 30px;
      border-radius: 14px;
      border-top: 3px solid #2d9b8a;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
    }

    .check {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #e6f4f1;
      color: #1f7468;
      font-size: 32px;
      line-height: 60px;
      font-weight: 700;
    }

    .box h1 {
      margin: 0 0 10px;
      font-size: 1.5rem;
    }

    .box p {
      color: #4b5563;
      margin: 6px 0;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="check">&checkmark;</div>
    <h1>Thank You!</h1>
    <p>Your request has been submitted successfully.</p>
    <p>You will be redirected shortly&hellip;</p>
  </div>
</body>

</html>
